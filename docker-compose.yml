services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
      - ./scripts/inner:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fox_net

  orchestrator:
    build: ./orchestrator
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:?définir GEMINI_MODEL dans .env}
      HISTORY_LIMIT: ${HISTORY_LIMIT:-10}
      MAX_CALLS_PER_DAY: ${MAX_CALLS_PER_DAY:-200}
      MAX_TOKENS_PER_DAY: ${MAX_TOKENS_PER_DAY:-500000}
      ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID}
      TIMEZONE: ${TIMEZONE:-Africa/Douala}
      PENDING_TTL_MINUTES: ${PENDING_TTL_MINUTES:-10}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-4}
      LLM_RETRY_BUDGET_SECONDS: ${LLM_RETRY_BUDGET_SECONDS:-40}
      LLM_BACKOFF_BASE: ${LLM_BACKOFF_BASE:-1.0}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-}
      HISTORY_MAX_CHARS: ${HISTORY_MAX_CHARS:-1200}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_HISTORY_LIMIT: ${GROQ_HISTORY_LIMIT:-4}
      UNDO_WINDOW_MINUTES: ${UNDO_WINDOW_MINUTES:-60}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      FOX_SERVICE_TOKEN: ${FOX_SERVICE_TOKEN:?définir FOX_SERVICE_TOKEN dans .env (voir .env.example)}
      OWNER_USERNAME: ${OWNER_USERNAME:-owner}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      OWNER_MAX_CALLS_PER_DAY: ${OWNER_MAX_CALLS_PER_DAY:-200}
      OWNER_MAX_TOKENS_PER_DAY: ${OWNER_MAX_TOKENS_PER_DAY:-500000}
      TESTER_MAX_CALLS_PER_DAY: ${TESTER_MAX_CALLS_PER_DAY:-30}
      TESTER_MAX_TOKENS_PER_DAY: ${TESTER_MAX_TOKENS_PER_DAY:-15000}
      RETENTION_DAYS_OWNER: ${RETENTION_DAYS_OWNER:-90}
      RETENTION_DAYS_TESTER: ${RETENTION_DAYS_TESTER:-30}
      PRIVATE_CONTEXT_MINUTES: ${PRIVATE_CONTEXT_MINUTES:-30}
      FORMAT_REPLIES: ${FORMAT_REPLIES:-1}
      MAX_MEMORIES: ${MAX_MEMORIES:-30}
      MAX_OPEN_TASKS: ${MAX_OPEN_TASKS:-50}
      TASK_RETENTION_DAYS: ${TASK_RETENTION_DAYS:-90}
      GROQ_MAX_CALLS_PER_DAY: ${GROQ_MAX_CALLS_PER_DAY:-900}
      GROQ_MAX_TOKENS_PER_DAY: ${GROQ_MAX_TOKENS_PER_DAY:-180000}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - fox_net

  telegram_bot:
    build: ./telegram_bot
    restart: unless-stopped
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID}
      FOX_SERVICE_TOKEN: ${FOX_SERVICE_TOKEN:?définir FOX_SERVICE_TOKEN dans .env (voir .env.example)}
      ORCHESTRATOR_URL: http://orchestrator:5000
      REMINDER_POLL_SECONDS: ${REMINDER_POLL_SECONDS:-30}
    depends_on:
      orchestrator:
        condition: service_healthy
    networks:
      - fox_net

  # Tests automatiques : docker compose --profile test run --rm tests
  # Ils créent une base temporaire et ne touchent jamais à la base de FOX.
  tests:
    profiles: ["test"]
    build: ./orchestrator
    working_dir: /tests
    environment:
      TEST_ADMIN_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/postgres
      ORCHESTRATOR_DIR: /srv
      BOT_DIR: /bot
      DB_DIR: /db
    volumes:
      - ./orchestrator:/srv
      - ./telegram_bot:/bot:ro
      - ./tests:/tests:ro
      - ./db:/db:ro
    command: sh -c "pip install -q -r /srv/requirements-dev.txt && python -m pytest -q /tests"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fox_net

networks:
  fox_net:

volumes:
  pgdata:
